<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>최종 대통합 가설 리포트 - 수식 유도 & 시각화 대량 생산 시스템</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #1a1a1d; color: #e1e1e6; margin: 20px; }
        h1, h2, h3 { border-bottom: 2px solid #950740; padding-bottom: 10px; color: #c3073f; }
        
        /* 제어판 */
        .controls { background: #222; padding: 20px; border-radius: 8px; border: 1px solid #4e4e50; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; }
        label { font-weight: bold; }
        input[type="number"] { padding: 8px; border-radius: 4px; border: 1px solid #c3073f; background: #000; color: #e1e1e6; width: 60px;}
        button { padding: 10px 20px; background-color: #c3073f; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: background 0.3s;}
        button:hover { background-color: #950740; }
        button:disabled { background-color: #4e4e50; cursor: not-allowed; }

        /* 상태 창 */
        #status { font-family: monospace; font-size: 0.9rem; background: #000; padding: 15px; border-radius: 5px; height: 120px; overflow-y: auto; border: 1px solid #4e4e50; color: #44dd44; margin-bottom: 20px; }

        /* 결과물 그리드 영역 */
        #production-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }

        /* 세트 카드 */
        .viz-set-card { background: #2a2a2e; border-radius: 8px; border: 1px solid #4e4e50; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.3s; }
        .viz-set-card:hover { transform: translateY(-5px); border-color: #c3073f; }
        .viz-set-header { padding: 10px; background: #1a1a1d; border-bottom: 1px solid #4e4e50; font-size: 0.85rem; font-family: monospace; display: flex; justify-content: space-between;}
        .tag-stable { color: #44dd44; } .tag-chaotic { color: #ffcc00; } .tag-cluster { color: #44aaff; } .tag-singular { color: #ff4444; font-weight: bold; }

        /* 이미지 컨테이너 */
        .img-container { padding: 10px; display: flex; flex-direction: column; gap: 10px;}
        .img-box { width: 100%; border: 1px solid #4e4e50; border-radius: 4px; overflow: hidden; background: #000;}
        .img-box img { width: 100%; height: auto; display: block; border-bottom: 1px solid #4e4e50; }
        .img-label { padding: 5px; font-size: 0.8rem; text-align: center; color: #8e8e93; background: #222;}

        /* 로딩 스피너 */
        #loading { display: none; text-align: center; font-size: 1.5rem; margin-top: 50px; color: #c3073f; }
    </style>
</head>
<body>

    <header>
        <h1>[최종 대통합 가설 리포트] - 통합 생산 시스템 v1.1</h1>
        <p>파이프라인(식1~10) 유도 -> 토이 물리 엔진(정적/동적) 시뮬레이션 -> 시각화 대량 생산 (다양성 강화 버전)</p>
    </header>

    <section class="controls">
        <label for="numSets">생산 세트 수 (추천: 15~20):</label>
        <input type="number" id="numSets" value="12" min="1" max="50">
        <button id="btnProduce" onclick="startMassProduction()">🚀 클릭 한번으로 대량 시각화 생산 시작</button>
    </section>

    <div id="status">시스템 대기 중... 생산 버튼을 클릭하세요.</div>

    <div id="loading">생산 중... (특이점을 탐색하고 있습니다.)<br><br><img src="https://i.gifer.com/ZZ5H.gif" width="50"></div>

    <main id="production-grid">
        </main>

    <script src="https://cdn.jsdelivr.net/npm/sympy/dist/sympy.min.js"></script>
    <script>
        // ---------------------------------------------------------------------------
        // [시스템 환경] 및 Mock 라이브러리 정의
        // (파이썬 코드의 '형태'를 자바스크립트로 시뮬레이션하기 위한 가짜 데이터 및 함수)
        // ---------------------------------------------------------------------------

        const logStatus = (msg) => {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML += `> ${msg}<br>`;
            statusDiv.scrollTop = statusDiv.scrollHeight;
        };

        const randomUniform = (min, max) => Math.random() * (max - min) + min;
        const randomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const randomChoice = (arr) => arr[Math.floor(Math.random() * arr.length)];

        // (Mock) 이미지를 메모리에 생성하고 데이터 URL을 반환하는 함수 (이미지 캔버스 시뮬레이션)
        const createMockImage = (type, params) => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = (type === 'static') ? 900 : 800;
            canvas.height = (type === 'static') ? 275 : 250;
            const seed = params.seed || 0;

            // 배경
            ctx.fillStyle = (type === 'static') ? '#f0f0f5' : '#fafafa';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 시각화 형태 시뮬레이션
            if (type === 'static') {
                // image_2.png 형태 (3 패널)
                ctx.fillStyle = '#000'; ctx.font = '12px serif'; ctx.fillText(`[Mock] Static viz: s${seed}`, 10, 20);
                
                // Panel 1: Full view
                ctx.strokeRect(20, 40, 250, 215);
                ctx.fillStyle = '#662222'; ctx.fillRect(30, 50, 230, 195); // Contours
                for(let i=0; i<params.n_particles; i++) {
                    ctx.beginPath(); ctx.arc(60 + i*20, 100 + i*15, 5 + params.charges[i]*3, 0, Math.PI*2);
                    ctx.fillStyle = (params.charges[i] > 0) ? '#d62728' : '#1f77b4'; ctx.fill();
                    ctx.strokeStyle = '#000'; ctx.stroke();
                }

                // Panel 2: Zoom
                ctx.strokeRect(320, 40, 250, 215);
                ctx.fillStyle = '#441111'; ctx.fillRect(330, 50, 230, 195);
                ctx.beginPath(); ctx.arc(445, 147, 10, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill(); // origin

                // Panel 3: Convergence
                ctx.strokeRect(620, 40, 250, 215);
                ctx.beginPath(); ctx.moveTo(630, 240);
                for(let x=1; x<30; x++) ctx.lineTo(630 + x*8, 240 - Math.exp(-x/5)*150 + Math.random()*10);
                ctx.strokeStyle = '#2ca02c'; ctx.lineWidth = 1.5; ctx.stroke();

            } else {
                // image_0.png 형태 (단일 패널 u(x,t))
                ctx.fillStyle = '#000'; ctx.font = '12px serif'; ctx.fillText(`[Mock] Dynamic gif: dt${params.dt}, n50`, 10, 20);
                
                // Main plot: Burgers+MHD source
                ctx.strokeRect(50, 40, 700, 190);
                ctx.fillStyle = '#8e8e93'; ctx.font = '10px sans-serif'; ctx.fillText('t=0.5000', 370, 35);

                // Waveform
                ctx.beginPath(); ctx.moveTo(70, 135);
                for(let x=1; x<150; x++) {
                    const wave = Math.sin(x/10) * Math.exp(-x/40) * 80 + 135;
                    ctx.lineTo(70 + x*4.5, wave);
                }
                ctx.strokeStyle = '#dc143c'; ctx.lineWidth = 2.5; ctx.stroke(); // crimson numerical
                
                ctx.beginPath(); ctx.moveTo(70, 135);
                for(let x=1; x<150; x++) {
                    const wave = Math.sin(x/10) * Math.exp(-x/40) * 80 + 135 + Math.sin(x/2)*2;
                    ctx.lineTo(70 + x*4.5, wave);
                }
                ctx.strokeStyle = '#000080'; ctx.lineWidth = 2; ctx.setLineDash([3, 3]); ctx.stroke(); // navy analytic
                ctx.setLineDash([]);
            }

            return canvas.toDataURL((type === 'static') ? 'image/png' : 'image/gif');
        };

        // ---------------------------------------------------------------------------
        // [물리 엔진 & 시각화 생산] Mock 모듈
        // ---------------------------------------------------------------------------

        const visualize_static_scenario = (params) => {
            logStatus(`[static] 생산 시작: n${params.n_particles}, s${params.seed}`);
            
            // 전하 및 위치 시뮬레이션
            const charges = [];
            let meanPos = 0;
            for(let i=0; i<params.n_particles; i++) {
                const q = randomUniform(0.2, 1.0) * randomChoice([-1, 1]);
                charges.push(q);
                meanPos += q; // '거리' 대신 전하 합으로 특이점을 시뮬레이션
            }

            // [특이점 조건] 총 전하의 절대값이 입자 수의 절반을 넘으면 "분산/특이점"으로 간주
            const singular = Math.abs(meanPos) > (params.n_particles * 0.4);

            return {
                imgData: createMockImage('static', { seed: params.seed, n_particles: params.n_particles, charges: charges }),
                final_positions: [[1.2, 0.5], [-0.3, -1.8]],
                charges: charges,
                final_energy: -2.876,
                singular: singular,
                meanPos: meanPos // 보조 진단값
            };
        };

        const visualize_dynamic_scenario = (params, n_particles) => {
            logStatus(`[dynamic] 생산 시작: dt${params.dt}, n_steps${180 + n_particles*8}`);
            
            // 상대 오차 시뮬레이션
            const rel_err = randomUniform(0.001, 0.4);
            const singular = rel_err > 0.35; // 오차가 너무 크면 '특이점(수렴 실패)'

            return {
                imgPngData: createMockImage('dynamic_summary', { dt: params.dt }), // 요약 PNG (Mock은 동일 이미지)
                imgGifData: createMockImage('dynamic', { dt: params.dt }), // GIF
                t_final: 1.100,
                relative_error: rel_err,
                singular: singular
            };
        };

        // ---------------------------------------------------------------------------
        // [시스템 메인 함수] 클릭 한번으로 대량 생산
        // ---------------------------------------------------------------------------

        async function startMassProduction() {
            const numSetsInput = document.getElementById('numSets');
            const numSets = parseInt(numSetsInput.value);
            const btn = document.getElementById('btnProduce');
            const grid = document.getElementById('production-grid');
            const statusDiv = document.getElementById('status');
            const loading = document.getElementById('loading');

            // UI 초기화
            grid.innerHTML = '';
            statusDiv.innerHTML = '🚀 [시스템] 대량 생산 파이프라인 가동...<br>';
            btn.disabled = true;
            numSetsInput.disabled = true;
            loading.style.display = 'block';

            await new Promise(r => setTimeout(r, 1000)); // 로딩 시뮬레이션

            let singularSets = [];
            let totalSingular = 0;

            // 다양성 최대화 루프
            for (let i = 0; i < numSets; i++) {
                // [식3·5] 다양한 파라미터 조합 생성
                const n_particles = randomChoice([4, 5, 6, 7, 8, 10, 12, 15]);
                const lr = randomUniform(0.005, 0.035).toFixed(4);
                const seed = randomInt(10, 9999);
                const dt = randomUniform(0.0012, 0.0035).toFixed(4);
                
                // 가짜 태그 조합
                const baseTag = randomChoice(["balance", "cluster", "spread", "balance", "strong"]);
                
                logStatus(`[${i + 1}/${numSets}] s${seed} 파라미터 구성 중...`);

                // 1. 정적 시나리오 생산 (평형 탐색, 식1·3·7)
                const staticResult = visualize_static_scenario({
                    n_particles: n_particles,
                    steps: 1800 + n_particles * 80,
                    lr: parseFloat(lr),
                    seed: seed
                });

                // 2. 동적 시나리오 생산 (PDE 전개, 식3·4·5·6)
                const dynamicResult = visualize_dynamic_scenario({
                    n_x: 160,
                    x_max: 6.5,
                    dt: parseFloat(dt),
                    n_frames: 50
                }, n_particles);

                // 3. 특이점(분산) 통합 진단
                let tag = staticResult.singular ? "singular" : (dynamicResult.singular ? "unstable" : baseTag);
                if (tag === "singular" || tag === "unstable") {
                    singularSets.push(`[${i+1}]s${seed}(${tag})`);
                    totalSingular++;
                }

                const name = `${tag}_n${n_particles}_lr${lr}_s${seed}`;

                // 4. HTML 카드 랜더링 (특이점 상태 강조)
                const setCard = document.createElement('div');
                setCard.className = `viz-set-card ${staticResult.singular ? 'singular-set' : ''}`;
                
                setCard.innerHTML = `
                    <div class="viz-set-header">
                        <span class="set-name">${name}</span>
                        <span class="set-tag tag-${tag}">${tag.toUpperCase()}</span>
                    </div>
                    <div class="img-container">
                        <div class="img-box">
                            <img src="${staticResult.imgData}" alt="Static Visualisation">
                            <div class="img-label">정적 평형 구성 + 에너지 수렴 (E: ${staticResult.final_energy.toFixed(3)})</div>
                        </div>
                        <div class="img-box">
                            <img src="${dynamicResult.imgGifData}" alt="Dynamic u(x,t) GIF">
                            <div class="img-label">MHD 운동량PDE 전개 (t0~1.1, Error: ${dynamicResult.relative_error.toFixed(4)})</div>
                        </div>
                    </div>
                `;
                
                grid.appendChild(setCard);
                logStatus(`✓ 완료: ${name}`);
                await new Promise(r => setTimeout(r, 150)); // 랜더링 속도 조절
            }

            // 생산 완료 상태
            loading.style.display = 'none';
            logStatus(`\n🎉 [시스템] 생산 완료! ${numSets}세트 (${numSets * 3}개 파일 데이터 URL 생성)`);
            logStatus(`   특이점/불안정 감지 세트: ${totalSingular} / ${numSets}`);
            statusDiv.innerHTML = `🎉 대량 생산 파이프라인 가동 완료.<br>특이점 세트: ${totalSingular}개`;
            btn.disabled = false;
            numSetsInput.disabled = false;

            // 특이점 도달 시 Alert
            if (totalSingular > 0) {
                setTimeout(() => {
                    alert(`🚨 경고: 최종 대통합 파이프라인에서 물리적 특이점이 관측되었습니다!\n\n${totalSingular}개의 세트가 'SINGULAR(분산)' 또는 'UNSTABLE(수렴실패)' 상태에 도달했습니다.\n(감지된 세트: ${singularSets.slice(0,3).join(', ')}...)`);
                }, 500);
            }
        }

    </script>
</body>
</html>
